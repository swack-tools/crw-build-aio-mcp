# Layered on src/crw/docker-compose.yml + docker-compose.stealth.yml, so the
# upstream service settings and hardening stay in effect (see `compose` in
# scripts/lib.sh). This file swaps in our locally built images, adds the
# Camoufox tier and makes the stealth tiers crw's default. Relative paths here
# would resolve against src/crw/.
services:
  crw:
    image: ${PROJECT:-crw-config}/crw:${TAG:-local}
    build: !reset null
    pull_policy: never
    # Upstream binds 0.0.0.0 unless CRW_BIND_ADDRESS is set; default to loopback.
    ports: !override
      - ${CRW_BIND_ADDRESS:-127.0.0.1}:${CRW_HOST_PORT:-3000}:3000
    environment:
      - CRW_RENDERER__IMPERSONATED__ENABLED=true
      - CRW_RENDERER__CAMOUFOX__BASE_URL=http://camofox:9377
      # Auto mode's JS renderer is stealth Chrome. Upstream's auto tries
      # Lightpanda first, which has no stealth and answers most pages, so it
      # is left out; Camoufox is reachable with renderer = "camoufox".
      - CRW_RENDERER__MODE=chrome
      # crw sends this User-Agent from every tier (upstream's is "CRW/0.0.1").
      # scripts/up.sh sets CRW_USER_AGENT to match chrome-stealth's Chrome.
      - CRW_CRAWLER__USER_AGENT=${CRW_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36}
      # launch = {"stealth": true, "args": ["--disable-blink-features=AutomationControlled"]}:
      # the flag clears navigator.webdriver in pages crw opens over raw CDP,
      # which browserless's stealth plugin doesn't reach. A separate
      # `stealth=true` parameter would replace this launch value.
      - CRW_RENDERER__CHROME__WS_URL=ws://chrome-stealth:3000/chromium?token=${BROWSERLESS_TOKEN:-crwtest}&launch=%7B%22stealth%22%3Atrue%2C%22args%22%3A%5B%22--disable-blink-features%3DAutomationControlled%22%5D%7D
    depends_on: !override
      camofox:
        condition: service_healthy
      chrome-stealth:
        condition: service_healthy
      searxng:
        condition: service_healthy

  searxng:
    image: ${PROJECT:-crw-config}/searxng:${TAG:-local}
    pull_policy: never

  # Unused with mode = chrome, so it is neither built nor started.
  lightpanda:
    profiles: ["lightpanda"]

  chrome-stealth:
    image: ${PROJECT:-crw-config}/chrome-stealth:${TAG:-local}
    pull_policy: never
    # Only crw talks to it, over the compose network.
    ports: !reset []
    environment:
      # browserless caps each session at TIMEOUT ms, but crw pools its CDP
      # connections for up to 5 min idle (browser_pool.rs idle_timeout), so
      # upstream's 30s cut pooled connections off mid-scrape (WS close 1013).
      - TIMEOUT=600000

  camofox:
    image: ${PROJECT:-crw-config}/camofox:${TAG:-local}
    pull_policy: never
    profiles: ["stealth"]
    restart: unless-stopped
    environment:
      - CAMOFOX_PORT=9377
      - CAMOFOX_CRASH_REPORT_ENABLED=false
      - MAX_OLD_SPACE_SIZE=512
    shm_size: "2g"
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
