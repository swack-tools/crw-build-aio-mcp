StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = crw

Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.{md,txt}]
BasedOnStyles = Vale, Google
# Bare hostnames, as in the anti-bot results, aren't prose.
TokenIgnores = \b[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|org|net|io|fr|pl|nl|tv|au)\b

# Plain text has no code font, and this file names ~/Library/Application Support.
[release/README.txt]
Google.WordListCase = NO
