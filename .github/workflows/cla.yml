name: CLA

# Asks first-time contributors to sign CLA.md by commenting on their pull
# request. Signatures are stored in signatures/cla.json on the
# `cla-signatures` branch. This job never checks out the pull request's
# code, so pull_request_target is safe here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # AI coding agents (Claude, Codex, Antigravity, Gemini, Copilot, Cursor)
          # commit for whoever drives them and don't sign. The action matches a
          # commit's GitHub login, or its author name when no account is linked;
          # a * pattern matches anywhere in it, case-sensitively.
          allowlist: >-
            swackhamer,dependabot[bot],github-actions[bot],
            *Claude*,*claude*,*Codex*,*codex*,*Antigravity*,*antigravity*,
            *Gemini*,*gemini*,*Copilot*,*copilot*,*Cursor*,*cursor*
