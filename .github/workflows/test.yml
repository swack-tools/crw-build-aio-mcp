name: Tests

# Applies patches/crw/ to the CRW rev in patches/crw/UPSTREAM, the one the
# stack was last moved to, and runs the unit tests those patches add
# (scripts/test-patches.sh), such as the eBay reload checks. They run against
# mock servers, never live sites. A pull request's own change is what this run
# tests; the nightly image build clones upstream's head and is the alarm for a
# patch that no longer applies there. Bump UPSTREAM when moving CRW.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep crw's clone in the workspace, where the cache step can hash it.
      CRW_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - name: Clone crw at the rev the patches apply to
        run: |
          echo "CRW_REF=$(cat patches/crw/UPSTREAM)" >> "$GITHUB_ENV"
          CRW_REF="$(cat patches/crw/UPSTREAM)" scripts/fetch-sources.sh crw
      - name: Restore cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/crw/target
          key: crw-test-${{ runner.os }}-${{ hashFiles('src/crw/Cargo.lock') }}
          restore-keys: crw-test-${{ runner.os }}-
      - name: Run patch tests
        run: scripts/test-patches.sh
