# The stack: crw with stealth Chrome, Camoufox and SearXNG, on the images
# `just build` makes (scripts/release-bundle.sh pins a release's to the
# registry's). It started from the compose files in crw's repo and keeps
# their hardening. scripts/prep-sources.sh warns when upstream changes one of
# these crw files (git blob ids), so the change can be weighed here:
#   docker-compose.yml           139b4e2d6fbac724e7034f38da0c93ddd7f382c4
#   docker-compose.stealth.yml   dc04ca0872ee3423b23a64c22b6bc0094a22ee10
#   config/searxng/settings.yml  5f88f417910c58e4995b4452d03a40f47d70fdb8
services:
  crw:
    image: ${PROJECT:-crw-config}/crw:${TAG:-local}
    pull_policy: never
    # Loopback unless CRW_BIND_ADDRESS says otherwise (upstream binds 0.0.0.0).
    ports:
      - ${CRW_BIND_ADDRESS:-127.0.0.1}:${CRW_HOST_PORT:-3000}:3000
    depends_on:
      camofox:
        condition: service_healthy
      chrome-stealth:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      # The config.docker.toml built into the image; these settings override it.
      - CRW_CONFIG=config.docker
      - CRW_RENDERER__CHROME_POOL__SIZE=4
      - CRW_RENDERER__IMPERSONATED__ENABLED=true
      - CRW_RENDERER__CAMOUFOX__BASE_URL=http://camofox:9377
      # Auto mode's JS renderer is stealth Chrome, then Camoufox when Chrome
      # is blocked. Upstream's auto tries Lightpanda first, which has no
      # stealth and answers most pages, so it is left out.
      - CRW_RENDERER__MODE=chrome
      - CRW_RENDERER__CAMOUFOX__INCLUDE_IN_AUTO=true
      # Render every page in a browser unless the request says renderJs:false.
      # Upstream's auto starts with plain HTTP and only renders pages that
      # look unfinished, so a page that fills itself in after load (a bot
      # check's verdict, say) comes back as its empty shell.
      - CRW_RENDERER__RENDER_JS_DEFAULT=true
      # Pages load as they would for a person. Upstream blocks images, fonts,
      # media and analytics to save time, and pages can tell (a missing image
      # has no size; a bot check's script may be on the blocked list).
      - CRW_RENDERER__CHROME_INTERCEPT_RESOURCES=false
      # Open pages in Chrome's own profile, as a person's browser does.
      # Upstream's context pool gives each page a separate browser context,
      # which is an incognito window as far as pages can tell (its storage
      # quota gives it away), and fingerprint.com reports it as one.
      - CRW_RENDERER__CHROME_CONTEXT_POOL_ENABLED=false
      # Let Chrome's requests go straight out, as in a person's browser.
      # Upstream pauses each one to check it against private network ranges,
      # which breaks some anti-bot scripts (Kasada's cleared one cold visit
      # in four). Chrome's own Local Network Access still asks before a public
      # page reaches a private address (cdp-stealth.patch adds this switch).
      - CRW_RENDERER__CHROME_OUTBOUND_CHECK=false
      # crw sends this User-Agent from every tier (upstream's is "CRW/0.0.1").
      # scripts/up.sh sets CRW_USER_AGENT to match chrome-stealth's Chrome.
      - CRW_CRAWLER__USER_AGENT=${CRW_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36}
      # A plain Chrome DevTools endpoint, not browserless (see docker/chrome-stealth).
      - CRW_RENDERER__CHROME__WS_URL=ws://chrome-stealth:9222
      # Up to 24s (8 checks, 3s apart) for an anti-bot challenge to clear.
      # Upstream checks once, and its 12s page budget ends Cloudflare's
      # challenge (5-15s) early.
      - CRW_RENDERER__CHROME_CHALLENGE_MAX_RETRIES=8
      - CRW_RENDERER__CHROME_NAV_BUDGET_MS=40000
    # Upstream's limits for untrusted pages and PDFs: a bounded cgroup, no
    # swap, no fork bombs, a read-only root with /tmp the only scratch, and
    # no capabilities or privilege gain.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Backs /v1/search; only crw reaches it. config/searxng/settings.yml is
  # crw's: JSON results on, SearXNG's own limiter off.
  searxng:
    image: ${PROJECT:-crw-config}/searxng:${TAG:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-me-with-openssl-rand-hex-32-please}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/cache/searxng:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Google Chrome on a virtual display (docker/chrome-stealth). Only crw
  # talks to it, over the compose network. scripts/up.sh sets CRW_TZ to this
  # machine's timezone.
  chrome-stealth:
    image: ${PROJECT:-crw-config}/chrome-stealth:${TAG:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      - TZ=${CRW_TZ:-UTC}
    # Reaps Chrome's exited child processes.
    init: true
    shm_size: 2g
    mem_limit: 3g
    memswap_limit: 3g
    tmpfs:
      - /tmp:size=512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Camoufox behind camofox-browser's REST server, crw's fallback when
  # Chrome is blocked.
  camofox:
    image: ${PROJECT:-crw-config}/camofox:${TAG:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      - CAMOFOX_PORT=9377
      - CAMOFOX_CRASH_REPORT_ENABLED=false
      - MAX_OLD_SPACE_SIZE=512
      - TZ=${CRW_TZ:-UTC}
    shm_size: 2g
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
